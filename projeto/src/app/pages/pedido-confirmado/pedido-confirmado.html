<div class="pedido-confirmado">

  <div class="confirmacao">

    <div class="icone">
      ✓
    </div>

    <h1>Pedido realizado com sucesso!</h1>

    <p>
      Obrigado pela sua compra na Happy Pet.
    </p>

    <p class="numero">
      Número do pedido:
      <strong>#{{ numeroPedido }}</strong>
    </p>

    <button type="button" (click)="voltarParaLoja()">
      VOLTAR PARA A LOJA
    </button>

  </div>

</div>
